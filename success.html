<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>❤️</title>
<style>

body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(
        135deg,
        #ff0000,
        #ff4d6d,
        #ff758f,
        #ffb3c1
    );
    color:white;
    text-align:center;
    font-family:'Segoe UI',sans-serif;
}

h1{
    font-size:3rem;
    animation:pulse 1.5s infinite;
}

button{ 
    position:fixed;
    bottom:20px;
    left:20%;
    margin-top:30px;
    padding:15px 35px;
    border:none;
    border-radius:50px;
    font-size:18px;
    cursor:pointer;
    background:white;
    color:#ff4d6d;
    font-weight:bold;
    transition:.3s;
}

button:hover{
    transform:scale(1.05);
}

@keyframes pulse{
    50%{
        transform:scale(1.08);
    }
}

</style>
